[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chaos-stack"
version = "1.0.0"
description = "AWS LocalStack Chaos Engineering & Resilience CLI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "docker>=6.1.3",
    "boto3>=1.28.3",
    "duckdb>=0.9.0",
    "rich>=13.5.2"
]

[project.scripts]
chaos-stack = "cli.main:main"

[tool.setuptools]
packages = ["cli", "core", "attacks", "analytics"]
